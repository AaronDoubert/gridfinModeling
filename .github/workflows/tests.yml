name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # Qt's system libraries, for the offscreen GUI smoke test. Without these
      # PySide6 fails to import and tests/test_gui_smoke.py skips instead.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0

      - run: pip install -r requirements.txt

      - run: pytest -q

      - name: CLI preview still renders
        run: python -m gridfin preview -o "$RUNNER_TEMP/preview.png"
